# imac-display GRUB config.
# Embedded in EFI/BOOT/BOOTX64.EFI by grub-mkstandalone (docker/remaster.sh) and
# also copied to /boot/grub/grub.cfg on the key so it can be edited without a rebuild.
set timeout=2
set timeout_style=hidden
set default=od

search --no-floppy --set=root --label DEBLIVE
if [ -z "$root" ]; then set root=$cmdpath; fi

# Prefer the on-disk copy when present (guard variable stops the configfile loop).
if [ -z "$OD_CFG_LOADED" -a -f /boot/grub/grub.cfg ]; then
    set OD_CFG_LOADED=1
    export OD_CFG_LOADED
    configfile /boot/grub/grub.cfg
fi

# live-boot: /live/filesystem.squashfs on this FAT32 partition; persistence = the
# ext4 image file /persistence on the same partition (persistence-storage default
# "filesystem,file" finds a file named after the label "persistence").
set OD_CMDLINE="boot=live components persistence hostname=imac27 noautologin consoleblank=0 net.ifnames=0"

menuentry "iMac 27 display (OpenDisplay receiver kiosk)" --id od {
    linux /live/vmlinuz $OD_CMDLINE quiet loglevel=3 systemd.show_status=0
    initrd /live/initrd.img
}
menuentry "Same, verbose boot (troubleshooting)" --id od_verbose {
    linux /live/vmlinuz $OD_CMDLINE loglevel=7
    initrd /live/initrd.img
}
menuentry "Fresh boot, ignore persistence" --id od_nopersist {
    linux /live/vmlinuz boot=live components hostname=imac27 noautologin consoleblank=0 net.ifnames=0 quiet loglevel=3
    initrd /live/initrd.img
}
menuentry "Serial console (QEMU test, ttyS0)" --id od_serial {
    linux /live/vmlinuz $OD_CMDLINE console=tty0 console=ttyS0,115200n8 loglevel=6
    initrd /live/initrd.img
}
