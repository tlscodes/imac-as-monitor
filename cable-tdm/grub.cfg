# Embedded in EFI/BOOT/BOOTX64.EFI (grub-mkstandalone) and also copied to
# /boot/grub/grub.cfg on the USB key so it can be edited without a rebuild.
set timeout=0
set timeout_style=hidden

search --no-floppy --set=root --label TINYCORE
if [ -z "$root" ]; then set root=$cmdpath; fi

# If the USB copy of this file is newer/edited, prefer it (guard against loops).
if [ -z "$TDM_CFG_LOADED" -a -f /boot/grub/grub.cfg ]; then
    set TDM_CFG_LOADED=1
    export TDM_CFG_LOADED
    configfile /boot/grub/grub.cfg
fi

menuentry "iMac Target Display Mode (TinyCore 16)" --id tdm {
    linux /boot/vmlinuz64 quiet loglevel=3 waitusb=5:LABEL=TINYCORE tce=LABEL=TINYCORE/tce nodhcp noswap nortc blacklist=applesmc consoleblank=0
    initrd /boot/corepure64.gz
}
menuentry "Same, verbose boot (troubleshooting)" --id tdm_verbose {
    linux /boot/vmlinuz64 waitusb=10:LABEL=TINYCORE tce=LABEL=TINYCORE/tce nodhcp noswap nortc blacklist=applesmc consoleblank=0
    initrd /boot/corepure64.gz
}
