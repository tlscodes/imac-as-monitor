# Embedded in EFI/BOOT/BOOTX64.EFI (grub-mkstandalone) and also copied to
# /boot/grub/grub.cfg on the USB key so it can be edited without a rebuild.
#
# Boot menu: press 1-5, or press nothing -> entry 1 starts after 3 seconds.
# The chosen mode reaches Linux as tdm=auto|once|console on the kernel command
# line; /usr/local/tce.installed/tdm reads it. Every boot writes its log to the
# key itself: TINYCORE/tce/log/ (boot.log, guard.log, dmesg.log).
set timeout=3
set timeout_style=menu
set default=0

search --no-floppy --set=root --label TINYCORE
if [ -z "$root" ]; then set root=$cmdpath; fi

# If the USB copy of this file is newer/edited, prefer it (guard against loops).
if [ -z "$TDM_CFG_LOADED" -a -f /boot/grub/grub.cfg ]; then
    set TDM_CFG_LOADED=1
    export TDM_CFG_LOADED
    configfile /boot/grub/grub.cfg
fi

menuentry "1  Monitor mode - automatic (default in 3 s)" --hotkey=1 --id auto {
    linux /boot/vmlinuz64 quiet loglevel=3 waitusb=5:LABEL=TINYCORE tce=LABEL=TINYCORE/tce nodhcp noswap nortc blacklist=applesmc consoleblank=0 tdm=auto
    initrd /boot/corepure64.gz
}
menuentry "2  Monitor mode - verbose boot (troubleshooting)" --hotkey=2 --id verbose {
    linux /boot/vmlinuz64 loglevel=7 waitusb=10:LABEL=TINYCORE tce=LABEL=TINYCORE/tce nodhcp noswap nortc blacklist=applesmc consoleblank=0 tdm=auto
    initrd /boot/corepure64.gz
}
menuentry "3  Linux console only - no switch, read tce/log/" --hotkey=3 --id console {
    linux /boot/vmlinuz64 loglevel=4 waitusb=5:LABEL=TINYCORE tce=LABEL=TINYCORE/tce nodhcp noswap nortc blacklist=applesmc consoleblank=0 tdm=console
    initrd /boot/corepure64.gz
}
menuentry "4  Monitor mode - single switch, no guard (classic)" --hotkey=4 --id once {
    linux /boot/vmlinuz64 quiet loglevel=3 waitusb=5:LABEL=TINYCORE tce=LABEL=TINYCORE/tce nodhcp noswap nortc blacklist=applesmc consoleblank=0 tdm=once
    initrd /boot/corepure64.gz
}
menuentry "5  Power off" --hotkey=5 --id off {
    halt
}
